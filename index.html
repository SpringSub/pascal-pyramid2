<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスカルの三角錐（直角三角錐）</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f3f4f6; font-family: sans-serif; }
        #info { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.5); backdrop-filter: blur(4px); padding: 7px 9px; border-radius: 6px; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.08); max-width: 190px; }
        #info h3 { margin: 0 0 2px 0; font-size: 11px; color: #1f2937; }
        #info p { margin: 0; font-size: 9px; color: #4b5563; line-height: 1.3; }
        #ui-panel { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.5); backdrop-filter: blur(4px); padding: 8px 10px; border-radius: 8px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 4px; width: 250px; }
        .control-row { display: flex; align-items: center; justify-content: space-between; gap: 3px; }
        label { font-size: 9px; font-weight: bold; color: #374151; min-width: 60px; }
        input[type="range"] { flex-grow: 1; margin: 0; height: 12px; }
        .val-span { font-size: 9px; font-weight: bold; color: #2563eb; min-width: 32px; text-align: right; }
        .section-title { font-size: 8px; color: #9ca3af; border-bottom: 1px solid #e5e7eb; margin: 2px 0 1px 0; padding-bottom: 1px; font-weight: bold; }

        .eq-input.invalid { border-color: #ef4444; background: #fef2f2; }
        .eq-input { width: 40px; padding: 2px; font-size: 10px; border: 1px solid #d1d5db; border-radius: 4px; text-align: center; background: rgba(255,255,255,0.7); }
        .eq-label { font-size: 10px; font-weight: bold; color: #374151; }
        .step-btn {
            background-color: rgba(255,255,255,0.6);
            border: 1px solid #d1d5db;
            color: #374151;
            font-size: 11px;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .step-btn:active {
            background-color: #e5e7eb;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
</head>
<body>
    <div id="info">
        <h3>パスカルの三角錐（直角三角錐）</h3>
        <p>頂点で3辺が直交（側面は直角二等辺三角形、底面は正三角形）<br>● 左ドラッグ：回転（制限なし）<br>● 右ドラッグ：移動<br>● スクロール：ズーム（制限なし）<br>● 頂点が原点、3辺が x・y・z 軸<br>● 平面 ax+by+cz=d を直接入力してスライス</p>
    </div>
    <div id="ui-panel">
        <div class="control-row">
            <label for="layerRange">階層の上限 (n): </label>
            <button class="step-btn" onclick="stepAdjust('layerRange', -1)">-</button>
            <input type="range" id="layerRange" min="0" max="10" value="5" step="1">
            <button class="step-btn" onclick="stepAdjust('layerRange', 1)">+</button>
            <span id="layerVal" class="val-span">5</span>
        </div>
        <div class="section-title">スライス平面の方程式（頂点が原点、3辺が x・y・z 軸）</div>
        <div class="control-row" style="justify-content:center; gap:4px;">
            <input type="text" id="planeA" class="eq-input" value="1" autocomplete="off" spellcheck="false"><span class="eq-label">x +</span>
            <input type="text" id="planeB" class="eq-input" value="1" autocomplete="off" spellcheck="false"><span class="eq-label">y +</span>
            <input type="text" id="planeC" class="eq-input" value="1" autocomplete="off" spellcheck="false"><span class="eq-label">z =</span>
            <input type="text" id="planeD" class="eq-input" value="3" autocomplete="off" spellcheck="false">
        </div>
        <div class="control-row">
            <label for="planeSide">うすくする側: </label>
            <select id="planeSide" style="flex-grow:1; padding:2px; font-size:9px;">
                <option value="gt">ax+by+cz &gt; d の側をうすく</option>
                <option value="lt">ax+by+cz &lt; d の側をうすく</option>
            </select>
        </div>
        <div id="eqText" style="font-size:9px; color:#2563eb; font-weight:bold; text-align:center;"></div>
        <div id="planeSum" style="font-size:9px; color:#b91c1c; font-weight:bold; text-align:center;"></div>
        <div style="font-size:8px; color:#6b7280; line-height:1.3;">各頂点 (n,i,j,k) は座標 (i,j,k) に対応。分数も入力可（例: 1/2）。</div>
    </div>
    <script>
        const memo = [];
        function fact(num) {
            if (num <= 1) return 1;
            if (memo[num]) return memo[num];
            let res = 1; for(let i = 2; i <= num; i++) res *= i;
            memo[num] = res; return res;
        }
        function trinomial(n, i, j, k) {
            return fact(n) / (fact(i) * fact(j) * fact(k));
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf3f4f6);
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100000);
        camera.position.set(0, 4, 18);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        // TrackballControls：上下の回転制限（真上・真下で止まる制限）がなく、どの向きにも自由に回せる
        const controls = new THREE.TrackballControls(camera, renderer.domElement);
        controls.rotateSpeed = 2.5;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.1;   // 右ドラッグ（平行移動）の感度。小さいほどゆっくり動く
        controls.staticMoving = false;
        controls.dynamicDampingFactor = 0.12;
        controls.minDistance = 0;          // ズームの下限なし
        controls.maxDistance = Infinity;   // ズームの上限なし

        // 三角錐を画面の右上寄りに表示（値を変えると位置を調整できます）
        const VIEW_SHIFT_X = 0.10;  // 右へずらす割合（画面幅に対して）
        const VIEW_SHIFT_Y = 0.12;  // 上へずらす割合（画面高さに対して）
        function applyViewOffset() {
            const w = window.innerWidth, h = window.innerHeight;
            camera.setViewOffset(w, h, -w * VIEW_SHIFT_X, h * VIEW_SHIFT_Y, w, h);
        }
        applyViewOffset();

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6); dirLight.position.set(10, 20, 10); scene.add(dirLight);

        const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

        const spriteCache = {};
        function getCachedSprite(text) {
            if (spriteCache[text]) {
                const s = spriteCache[text].clone();
                s.material = s.material.clone(); // 色を個別に変えられるよう独立させる
                return s;
            }
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const base = 8;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath(); ctx.arc(64 * base, 64 * base, 50 * base, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth = 5 * base; ctx.strokeStyle = '#1e3a8a'; ctx.stroke();
            let fontSize = 44 * base;
            if (text.length > 2) fontSize = 32 * base;
            if (text.length > 4) fontSize = 24 * base;
            ctx.fillStyle = '#000000'; ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 64 * base, 64 * base);
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearMipmapLinearFilter; texture.magFilter = THREE.LinearFilter;
            if (maxAnisotropy > 0) texture.anisotropy = maxAnisotropy;
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(0.45, 0.45, 0.45);
            spriteCache[text] = sprite;
            return sprite.clone();
        }

        let meshGroup = new THREE.Group();
        let spriteGroup = new THREE.Group();
        let axisGroup = new THREE.Group();
        scene.add(meshGroup);
        scene.add(spriteGroup);
        scene.add(axisGroup);

        // ===== 直角三角錐（頂点で3辺が直交）の幾何 =====
        // 3本の直交する辺ベクトル a, b, c（長さはすべて spacing）を、
        // a+b+c が真下(-y)を向くように配置する。
        //   各ベクトルの鉛直成分   : -spacing/√3
        //   各ベクトルの水平成分の長さ: spacing*√(2/3)（水平面内で120°ずつ）
        // → 各階層 (i+j+k=n) は水平な正三角形になり、a·b = 0 が成り立つ。
        const spacing = 1.2;
        const heightFactor = spacing / Math.sqrt(3);          // 1階層あたりの高さ
        const horizR = spacing * Math.sqrt(2 / 3);            // 水平成分の長さ
        const uA = new THREE.Vector2(0, 1);                   // (x, z) 方向の単位ベクトル
        const uB = new THREE.Vector2(-Math.sqrt(3) / 2, -0.5);
        const uC = new THREE.Vector2(Math.sqrt(3) / 2, -0.5);

        // 格子座標 (x,y,z)=(i,j,k) → ワールド座標：P = apex + x*LA + y*LB + z*LC
        const LA = new THREE.Vector3(horizR * uA.x, -heightFactor, horizR * uA.y);
        const LB = new THREE.Vector3(horizR * uB.x, -heightFactor, horizR * uB.y);
        const LC = new THREE.Vector3(horizR * uC.x, -heightFactor, horizR * uC.y);
        let apexY = 0;

        // ワールド座標 → 格子座標 (i,j,k) への変換行列（LA,LB,LC を列とする行列の逆行列）
        const basisMatrix = new THREE.Matrix3().set(
            LA.x, LB.x, LC.x,
            LA.y, LB.y, LC.y,
            LA.z, LB.z, LC.z
        );
        const invBasisMatrix = basisMatrix.clone().invert();

        // スライス平面を、格子模様＋くっきりした縁取りで見やすくする。
        // 三角錐（i,j,k≥0 かつ i+j+k≤maxLayer の範囲）に触れている部分だけ濃く、
        // それ以外の部分はうすく表示するシェーダー。
        function makeSliceGridTexture() {
            const size = 512;
            const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
            const cx = cv.getContext('2d');
            cx.fillStyle = 'rgba(239,68,68,0.30)'; cx.fillRect(0, 0, size, size);
            cx.strokeStyle = 'rgba(255,255,255,0.55)'; cx.lineWidth = 3;
            const n = 12, step = size / n;
            for (let i = 1; i < n; i++) {
                cx.beginPath(); cx.moveTo(i * step, 0); cx.lineTo(i * step, size); cx.stroke();
                cx.beginPath(); cx.moveTo(0, i * step); cx.lineTo(size, i * step); cx.stroke();
            }
            const tex = new THREE.CanvasTexture(cv);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }
        const SLICE_OUTSIDE_OPACITY = 0.05; // 三角錐に触れていない部分の不透明度（うすく）
        const SLICE_INSIDE_OPACITY = 0.85;  // 三角錐に触れている（切断面になっている）部分の不透明度（濃く）
        const slicePlaneGeo = new THREE.PlaneGeometry(1, 1);
        const slicePlaneMat = new THREE.ShaderMaterial({
            uniforms: {
                map: { value: makeSliceGridTexture() },
                maxLayer: { value: 1 },
                invBasis: { value: invBasisMatrix },
                outsideOpacity: { value: SLICE_OUTSIDE_OPACITY },
                insideOpacity: { value: SLICE_INSIDE_OPACITY },
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vWorldPos;
                void main() {
                    vUv = uv * 6.0;
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPos = worldPos.xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPos;
                }
            `,
            fragmentShader: `
                uniform sampler2D map;
                uniform float maxLayer;
                uniform mat3 invBasis;
                uniform float outsideOpacity;
                uniform float insideOpacity;
                varying vec2 vUv;
                varying vec3 vWorldPos;
                void main() {
                    vec4 tex = texture2D(map, vUv);
                    vec3 lat = invBasis * vWorldPos; // 格子座標 (i, j, k)
                    float margin = 0.04;
                    float inI = smoothstep(-margin, margin, lat.x);
                    float inJ = smoothstep(-margin, margin, lat.y);
                    float inK = smoothstep(-margin, margin, lat.z);
                    float sum = lat.x + lat.y + lat.z;
                    float inSum = smoothstep(maxLayer + margin, maxLayer - margin, sum);
                    float inside = inI * inJ * inK * inSum;
                    float alpha = mix(outsideOpacity, insideOpacity, inside) * tex.a;
                    gl_FragColor = vec4(tex.rgb, alpha);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const slicePlaneMesh = new THREE.Mesh(slicePlaneGeo, slicePlaneMat);
        slicePlaneMesh.renderOrder = 1.5; // 三角錐の面より後に描き、埋もれて見えにくくなるのを防ぐ
        const sliceEdges = new THREE.EdgesGeometry(slicePlaneGeo);
        const sliceLineMat = new THREE.LineBasicMaterial({ color: 0xdc2626, transparent: true, opacity: 0.95, depthTest: false });
        const sliceLine = new THREE.LineSegments(sliceEdges, sliceLineMat);
        sliceLine.renderOrder = 3; // 縁取りは常に前面に見えるようにする
        scene.add(slicePlaneMesh);
        scene.add(sliceLine);

        let currentMaxLayer = -1;
        let sliceRadius = 1;
        const ON_PLANE_COLOR = 0xef4444;   // 平面上の点をこの色で強調（平面と同じ赤系）
        const DEFAULT_COLOR = 0xffffff;    // 通常の点の色（白＝元の見た目）
        const OPACITY_ON_PLANE = 1.0;       // 平面上の点
        const OPACITY_CUT_SIDE = 0.15;      // 「うすく表示」に選ばれている側の点
        const OPACITY_KEEP_SIDE = 0.55;     // もう一方の側の点

        function rebuildGeometry() {
            const maxLayer = parseInt(document.getElementById('layerRange').value);
            if (maxLayer === currentMaxLayer) return;
            currentMaxLayer = maxLayer;
            slicePlaneMat.uniforms.maxLayer.value = maxLayer;

            while(meshGroup.children.length > 0){ meshGroup.remove(meshGroup.children[0]); }
            while(spriteGroup.children.length > 0){ spriteGroup.remove(spriteGroup.children[0]); }
            while(axisGroup.children.length > 0){ axisGroup.remove(axisGroup.children[0]); }

            const totalHeight = maxLayer * heightFactor;
            apexY = 0; // 頂点(n=0)がワールド原点

            function getNodePosition(n, i, j, k) {
                const y = -n * heightFactor; // 頂点が y=0、下の階層ほど下へ
                const x = horizR * (i * uA.x + j * uB.x + k * uC.x);
                const z = horizR * (i * uA.y + j * uB.y + k * uC.y);
                return new THREE.Vector3(x, y, z);
            }

            for (let n = 1; n <= maxLayer; n++) {
                const pA = getNodePosition(n, n, 0, 0); const pB = getNodePosition(n, 0, n, 0); const pC = getNodePosition(n, 0, 0, n);
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array([pA.x, pA.y, pA.z, pB.x, pB.y, pB.z, pC.x, pC.y, pC.z]), 3));
                const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0x3b82f6, opacity: 0.05, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
                meshGroup.add(mesh);
                const line = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), new THREE.LineBasicMaterial({ color: 0x2563eb, transparent: true, opacity: 0.3 }));
                meshGroup.add(line);
            }

            const vTop = getNodePosition(0, 0, 0, 0);
            const vBottomA = getNodePosition(maxLayer, maxLayer, 0, 0);
            if (maxLayer >= 1) {
                const vBottomB = getNodePosition(maxLayer, 0, maxLayer, 0); const vBottomC = getNodePosition(maxLayer, 0, 0, maxLayer);
                const outerGeometry = new THREE.BufferGeometry();
                outerGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
                    vBottomA.x, vBottomA.y, vBottomA.z, vBottomB.x, vBottomB.y, vBottomB.z, vBottomC.x, vBottomC.y, vBottomC.z,
                    vTop.x, vTop.y, vTop.z, vBottomA.x, vBottomA.y, vBottomA.z, vBottomB.x, vBottomB.y, vBottomB.z,
                    vTop.x, vTop.y, vTop.z, vBottomB.x, vBottomB.y, vBottomB.z, vBottomC.x, vBottomC.y, vBottomC.z,
                    vTop.x, vTop.y, vTop.z, vBottomC.x, vBottomC.y, vBottomC.z, vBottomA.x, vBottomA.y, vBottomA.z,
                ]), 3));
                outerGeometry.computeVertexNormals();
                meshGroup.add(new THREE.Mesh(outerGeometry, new THREE.MeshPhongMaterial({ color: 0x1d4ed8, opacity: 0.02, transparent: true, side: THREE.DoubleSide, depthWrite: false })));
                meshGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(outerGeometry), new THREE.LineBasicMaterial({ color: 0x1e4ea8, transparent: true, opacity: 0.3 })));
            }

            // ===== x・y・z 軸（頂点＝原点を中心に、3辺の方向へ薄く表示）=====
            const axisDefs = [
                { dir: LA, color: 0xf97316, css: '#f97316', name: 'x' },
                { dir: LB, color: 0x16a34a, css: '#16a34a', name: 'y' },
                { dir: LC, color: 0x9333ea, css: '#9333ea', name: 'z' },
            ];
            const posLen = (maxLayer + 1.5) / 1;   // 格子単位での正方向の長さ
            const negLen = 1.5;                    // 負方向は短めに
            axisDefs.forEach(ax => {
                const unit = ax.dir.clone().divideScalar(spacing);   // 単位ベクトル
                const pPos = unit.clone().multiplyScalar(posLen * spacing);
                const pNeg = unit.clone().multiplyScalar(-negLen * spacing);
                const mkLine = (p1, p2, op) => new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints([p1, p2]),
                    new THREE.LineBasicMaterial({ color: ax.color, transparent: true, opacity: op, depthTest: false }));
                const l1 = mkLine(new THREE.Vector3(0, 0, 0), pPos, 0.4); l1.renderOrder = 1;
                const l2 = mkLine(new THREE.Vector3(0, 0, 0), pNeg, 0.18); l2.renderOrder = 1;
                axisGroup.add(l1); axisGroup.add(l2);
                // 軸ラベル（正方向の先端）
                const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
                const cx = cv.getContext('2d');
                cx.fillStyle = ax.css; cx.font = 'italic bold 84px serif';
                cx.textAlign = 'center'; cx.textBaseline = 'middle';
                cx.fillText(ax.name, 64, 68);
                const lab = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, opacity: 0.75, depthTest: false }));
                lab.position.copy(pPos).add(unit.clone().multiplyScalar(0.4));
                lab.scale.set(0.7, 0.7, 0.7); lab.renderOrder = 3;
                axisGroup.add(lab);
            });

            // 三角錐全体（重心）が画面中心に来るよう、カメラの注視点を移動（相対的な視点は維持）
            // 注視点は「重心から x 成分を除いた点」= 格子座標 (0, n/4, n/4)。
            // y-z 平面上にあるので、視線が y-z 平面内に入り、y軸とz軸が画面上で同じ縦線に揃う。
            const newTarget = new THREE.Vector3()
                .addScaledVector(LB, maxLayer / 4).addScaledVector(LC, maxLayer / 4);
            camera.position.add(newTarget.clone().sub(controls.target));
            controls.target.copy(newTarget);

            // 原点（頂点）から最も遠い頂点までの距離をスライサー半径の基準にする
            sliceRadius = Math.max(vBottomA.length(), 1) * 1.3;
            slicePlaneMesh.scale.set(sliceRadius * 2.5, sliceRadius * 2.5, 1);
            sliceLine.scale.set(sliceRadius * 2.5, sliceRadius * 2.5, 1);

            for (let n = 0; n <= maxLayer; n++) {
                for (let i = 0; i <= n; i++) {
                    for (let j = 0; j <= n - i; j++) {
                        const k = n - i - j;
                        const pos = getNodePosition(n, i, j, k);
                        const val = trinomial(n, i, j, k);
                        const sprite = getCachedSprite(val.toString());
                        sprite.position.copy(pos);
                        sprite.userData.i = i; sprite.userData.j = j; sprite.userData.k = k; sprite.userData.val = val;
                        sprite.renderOrder = 2;
                        spriteGroup.add(sprite);
                    }
                }
            }
        }

        // 整数・小数・分数（"1/2", "-3/4", "0.5/2", 全角も可）を数値に変換。不正なら null
        function parseFraction(str) {
            let t = str.trim()
                .replace(/[／÷]/g, '/').replace(/[−－ー]/g, '-').replace(/＋/g, '+').replace(/．/g, '.')
                .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
            const m = t.match(/^([+-]?)\s*(\d+(?:\.\d*)?|\.\d+)\s*(?:\/\s*(\d+(?:\.\d*)?|\.\d+))?$/);
            if (!m) return null;
            let v = parseFloat(m[2]);
            if (m[3] !== undefined) {
                const den = parseFloat(m[3]);
                if (den === 0) return null;
                v /= den;
            }
            if (m[1] === '-') v = -v;
            return { value: v, text: (m[1] === '-' ? '-' : '') + m[2] + (m[3] !== undefined ? '/' + m[3] : '') };
        }

        // 入力欄の値を読む。不正な場合は赤枠にして直前の有効値を使う
        function readNum(id) {
            const el = document.getElementById(id);
            const r = parseFraction(el.value);
            if (r === null) {
                el.classList.add('invalid');
                return el.dataset.val !== undefined ? parseFloat(el.dataset.val) : 0;
            }
            el.classList.remove('invalid');
            el.dataset.val = r.value; el.dataset.txt = r.text;
            return r.value;
        }
        function coefText(id) { return document.getElementById(id).dataset.txt || '0'; }

        function updateSlice() {
            rebuildGeometry();

            const pa = readNum('planeA'), pb = readNum('planeB'), pc = readNum('planeC'), pd = readNum('planeD');
            const removeGreater = document.getElementById('planeSide').value === 'gt';

            // 格子座標での勾配 (a,b,c) をワールド座標の法線へ変換（LA,LB,LC は直交・長さ spacing）
            const N = new THREE.Vector3()
                .addScaledVector(LA, pa).addScaledVector(LB, pb).addScaledVector(LC, pc)
                .divideScalar(spacing * spacing);
            const len = N.length();

            if (len < 1e-9) { // a=b=c=0：平面が定まらないので全点を通常表示
                slicePlaneMesh.visible = false; sliceLine.visible = false;
                spriteGroup.children.forEach(sprite => {
                    sprite.visible = true; sprite.material.color.set(DEFAULT_COLOR); sprite.material.opacity = OPACITY_ON_PLANE;
                });
                document.getElementById('planeSum').innerText = '平面上の数の合計: ―';
                return;
            }
            slicePlaneMesh.visible = true; sliceLine.visible = true;

            // f(P) = a x + b y + c z = N·(P - apex)。f > d ⇔ n·P > constant
            let normal = N.clone().divideScalar(len);
            let constant = (pd + N.y * apexY) / len;
            if (!removeGreater) { normal.negate(); constant = -constant; }

            const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
            slicePlaneMesh.quaternion.copy(q);
            slicePlaneMesh.position.copy(normal).multiplyScalar(constant);
            sliceLine.quaternion.copy(q);
            sliceLine.position.copy(slicePlaneMesh.position);


            const EPS = 1e-6;
            let onPlaneSum = 0;
            spriteGroup.children.forEach(sprite => {
                const { i, j, k, val } = sprite.userData;
                const diff = (pa * i + pb * j + pc * k) - pd; // ax+by+cz-d を格子座標から直接計算（誤差が出にくい）
                const onPlane = Math.abs(diff) < EPS;
                sprite.visible = true; // 三角錐は切らないので、点も隠さず常に表示する
                if (onPlane) {
                    sprite.material.color.set(ON_PLANE_COLOR);
                    sprite.material.opacity = OPACITY_ON_PLANE;
                    onPlaneSum += val;
                } else {
                    sprite.material.color.set(DEFAULT_COLOR);
                    const onFadedSide = removeGreater ? (diff > 0) : (diff < 0);
                    sprite.material.opacity = onFadedSide ? OPACITY_CUT_SIDE : OPACITY_KEEP_SIDE;
                }
            });
            document.getElementById('planeSum').innerText = `平面上の数の合計: ${onPlaneSum}`;
        }

        function stepAdjust(id, direction) {
            const el = document.getElementById(id);
            const min = parseFloat(el.min);
            const max = parseFloat(el.max);
            const step = parseFloat(el.step || 1);

            let newVal = parseFloat(el.value) + (direction * step);

            const precision = step.toString().includes('.') ? step.toString().split('.')[1].length : 0;
            newVal = parseFloat(newVal.toFixed(precision));

            if (newVal < min) newVal = min;
            if (newVal > max) newVal = max;

            el.value = newVal;
            updateUIValues();
            updateSlice();
        }

        document.getElementById('layerRange').addEventListener('input', () => { updateUIValues(); updateSlice(); });
        ['planeA', 'planeB', 'planeC', 'planeD', 'planeSide'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('input', () => { updateUIValues(); updateSlice(); });
            el.addEventListener('change', () => { updateUIValues(); updateSlice(); });
        });

        function updateUIValues() {
            document.getElementById('layerVal').innerText = document.getElementById('layerRange').value;
            const pa = readNum('planeA'), pb = readNum('planeB'), pc = readNum('planeC'), pd = readNum('planeD');
            const op = document.getElementById('planeSide').value === 'gt' ? '＞' : '＜';
            const box = document.getElementById('eqText');
            if (pa === 0 && pb === 0 && pc === 0) {
                box.innerText = '平面が定まりません（a,b,c を少なくとも1つ非0に）';
                return;
            }
            const term = (id, v) => { const t = coefText(id); return t.startsWith('-') ? ` − ${t.slice(1)}${v}` : ` + ${t}${v}`; };
            const lhs = (term('planeA', 'x') + term('planeB', 'y') + term('planeC', 'z')).replace(/^ \+ /, '').replace(/^ − /, '−');
            box.innerText = `平面: ${lhs} = ${coefText('planeD')}　（${op} の側をうすく表示）`;
        }

        updateUIValues();
        updateSlice();

        // ===== 初期カメラ：x軸＝右、y軸＝奥、z軸＝上 =====
        // 三角錐の3辺（LA,LB,LC）がそれぞれ x,y,z 軸。右手系で A×B = C なので、
        // 「右=A、奥=B、上=C」は矛盾なく成立する。真正面だと奥行きの y 軸が点に潰れるため、
        // 少しだけ上から見る（角度は下の定数で調整可）。
        const INIT_AZIMUTH_DEG = 0;     // 右側へ回り込む角度（0 で y軸・z軸が画面上で同じ縦線に揃う）
        const INIT_ELEVATION_DEG = 25;  // 上から見下ろす角度
        const INIT_DISTANCE = 18.5;
        function setInitialCamera() {
            const ax = LA.clone().normalize(), ay = LB.clone().normalize(), az = LC.clone().normalize();
            const az_ = INIT_AZIMUTH_DEG * Math.PI / 180, el = INIT_ELEVATION_DEG * Math.PI / 180;
            const offset = new THREE.Vector3()
                .addScaledVector(ay, -Math.cos(el) * Math.cos(az_))   // 手前側（y軸の逆）
                .addScaledVector(ax,  Math.cos(el) * Math.sin(az_))   // 右側
                .addScaledVector(az,  Math.sin(el))                   // 上側
                .multiplyScalar(INIT_DISTANCE);
            camera.up.copy(az);                                       // 画面の上 = z軸方向
            camera.position.copy(controls.target).add(offset);
            camera.lookAt(controls.target);
            controls.update();
        }
        setInitialCamera();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            applyViewOffset();
            renderer.setSize(window.innerWidth, window.innerHeight);
            controls.handleResize();
        });

        function animate() {
            requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
